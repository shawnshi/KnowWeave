[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "vector-lake-core"
version = "0.2.8"
description = "Rust native performance acceleration core for Vector Lake"
requires-python = ">=3.8"
dependencies = []

[tool.maturin]
features = ["pyo3/extension-module"]
sdist-include = ["Cargo.toml", "src/**/*"]
