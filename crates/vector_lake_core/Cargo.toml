[package]
name = "vector-lake-core"
version = "0.2.3"
edition = "2021"
description = "Rust native performance acceleration core for Vector Lake"
license = "MIT"

[lib]
name = "vector_lake_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
pulldown-cmark = { version = "0.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
# The CJK segmenter, built here rather than through the `rjieba` wheel.
#
# Why the pin lives in this file: `rjieba` (the only published Python binding) bundles
# jieba-rs **0.9.x** and its newest release is 0.2.1 (2026-04-25), while the crate has moved on
# to 0.11.0 (2026-09-16).  There was no `rjieba` dependency in any Cargo.toml to correct -- the
# version was whatever that wheel happened to link -- so getting a current crate means owning
# the binding.  `src/tokenizer.rs` exposes `cut`/`cut_joined` with rjieba's call shape
# (HMM enabled, matching `cut(text)`), so the two can be compared token-for-token before
# anything depends on this one.
jieba-rs = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
