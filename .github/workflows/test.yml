name: test

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # Windows Server is a regression lane, NOT Windows 11 attestation.
        os: [windows-2025, ubuntu-26.04, macos-26, macos-26-intel]
        backend: [native, fallback]
        python: ["3.10", "3.13"]
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scripts/ci-build-requirements.txt
            scripts/ci-test-requirements.txt
      - name: Record actual OS and kernel (never infer from runner label)
        env:
          EXPECTED_SYSTEM: ${{ runner.os }}
        run: |
          if [ "$EXPECTED_SYSTEM" = "macOS" ]; then
            python scripts/platform_check.py --require-target --expected-system Darwin --output "$RUNNER_TEMP/platform-check.json"
          elif [ "$EXPECTED_SYSTEM" = "Linux" ]; then
            python scripts/platform_check.py --require-target --expected-system Linux --expected-distro ubuntu --minimum-distro-version 26.04 --output "$RUNNER_TEMP/platform-check.json"
          else
            python scripts/platform_check.py --output "$RUNNER_TEMP/platform-check.json"
          fi
      - name: Install existing runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Install hash-verified existing test-only dependency
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes -r scripts/ci-test-requirements.txt
      - name: Install hash-verified CI build tool
        if: matrix.backend == 'native'
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes -r scripts/ci-build-requirements.txt
      - name: Build checkout native module (never host fallback)
        if: matrix.backend == 'native'
        env:
          CI_NATIVE_DIR: ${{ runner.temp }}/vector-lake-native
        run: |
          cargo --version
          python scripts/ci_core.py build --output "$CI_NATIVE_DIR" --timeout 900
      - name: Run explicit backend suite and prove loaded backend
        env:
          CI_NATIVE_DIR: ${{ runner.temp }}/vector-lake-native
          CI_CORE_RECEIPT: ${{ runner.temp }}/core-probe.json
        run: python scripts/ci_core.py test --backend "${{ matrix.backend }}" --native-dir "$CI_NATIVE_DIR" --receipt "$CI_CORE_RECEIPT" -- -q
